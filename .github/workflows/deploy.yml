name: Deploy stack

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "todo-api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.push.outputs.app_image }}
      todo_image: ${{ steps.push.outputs.todo_image }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/playground-app:${GITHUB_SHA}"
          docker build -t "$image" app
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
            - name: Build and push the images
        id: push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app_image="ghcr.io/$owner/playground-app:$GITHUB_SHA"
          todo_image="ghcr.io/$owner/todo-api:$GITHUB_SHA"
          docker build -t "$app_image" app
          docker build -t "$todo_image" todo-api
          docker push "$app_image"
          docker push "$todo_image"
          echo "app_image=$app_image" >> "$GITHUB_OUTPUT"
          echo "todo_image=$todo_image" >> "$GITHUB_OUTPUT"


  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: main
    timeout-minutes: 10
    steps:
      - name: Install WireGuard
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools

      - name: Connect to the VPN
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$WG_PRIVATE_KEY" | sudo tee /etc/wireguard/runner.key > /dev/null
          sudo chmod 600 /etc/wireguard/runner.key
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF
          [Interface]
          Address = 10.8.0.4/32
          PostUp = wg set %i private-key /etc/wireguard/runner.key

          [Peer]
          PublicKey = ${{ vars.WG_SERVER_PUBLIC_KEY }}
          Endpoint = ${{ vars.WG_ENDPOINT }}
          AllowedIPs = 172.31.0.0/16
          PersistentKeepalive = 25
          EOF
          sudo wg-quick up wg0

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_KNOWN_HOSTS: ${{ secrets.APP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$APP_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          TODO_IMAGE: ${{ needs.build.outputs.todo_image }}
          SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          TODO_DB_USER: ${{ secrets.TODO_DB_USER }}
          TODO_DB_PASSWORD: ${{ secrets.TODO_DB_PASSWORD }}
        run: |
          printf 'APP_SECRET_MESSAGE=%s\nAPP_USERNAME=%s\nAPP_PASSWORD=%s\nMONGO_ROOT_USERNAME=%s\nMONGO_ROOT_PASSWORD=%s\nTODO_DB_USER=%s\nTODO_DB_PASSWORD=%s\n' \
            "$SECRET_MESSAGE" "$APP_USERNAME" "$APP_PASSWORD" \
            "$MONGO_ROOT_USERNAME" "$MONGO_ROOT_PASSWORD" "$TODO_DB_USER" "$TODO_DB_PASSWORD" |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@${{ vars.APP_HOST }} \
            "sudo /usr/local/bin/deploy-playground-app $APP_IMAGE $TODO_IMAGE --settings-from-stdin"

      - name: Disconnect from the VPN
        if: always()
        run: sudo wg-quick down wg0 || true
