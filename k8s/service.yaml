apiVersion: v1
kind: Service
metadata:
  name: gitops-portfolio-app
  namespace: gitops-portfolio
spec:
  selector:
    app: gitops-portfolio-app
  ports:
    - port: 80
      targetPort: 3000
  # ClusterIP, not LoadBalancer: avoids provisioning an ELB (real $ cost) for
  # a demo app only ever accessed via kubectl port-forward, same reasoning as
  # ArgoCD's own UI access.
  type: ClusterIP
