- name: ansible-playbook setup.yml
  hosts: myhosts 
  become: true
  roles:
    - role: base
      tags: base
    - role: ssh
      tags: ssh

- name: ansible-playbook app setup.yml
  hosts: app
  become: true
  roles:
    - role: nginx
      tags: nginx
    - role: app
      tags: app

- name: ansible-playbook wireguard setup.yml
  hosts: bastion
  become: true
  roles:
    - role: wireguard
      tags: wireguard